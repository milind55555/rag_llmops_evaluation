name: RAG Evaluation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
      - name: Build local index
        run: python -m ragapp.ingest
      - name: Golden-set evaluation and regression gate
        run: python -m ragapp.evaluate
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: artifacts/evaluation_results.json
          if-no-files-found: ignore
